<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ball Hax Online</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;background:#168b45}.hidden{display:none!important}#lobby{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#07110ddd;padding:20px}.panel{width:min(410px,94vw);padding:24px;border-radius:18px;background:#172019f2;color:#fff;text-align:center;box-shadow:0 15px 50px #0008}.panel h1{margin:0 0 10px}.panel p{color:#cbd8ce}#name{width:100%;height:48px;border:0;border-radius:9px;padding:0 13px;font-size:17px}#join{width:100%;height:48px;margin-top:12px;border:0;border-radius:9px;background:#3aa65a;color:#fff;font-size:17px;font-weight:bold}#err{height:20px;color:#ff7777;font-size:13px;margin-top:8px}#hud{position:fixed;z-index:5;top:7px;left:50%;transform:translateX(-50%);color:#fff;text-align:center;font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none}#title{font-size:18px}#score{font-size:20px}#time{font-size:16px}#count{position:fixed;z-index:6;right:10px;top:10px;color:#fff;font-size:12px;text-shadow:0 2px 4px #000}.disc{position:fixed}.controls{position:fixed;inset:0;z-index:10;pointer-events:none}.joy{position:absolute;left:18px;bottom:34px;width:125px;height:125px;border:3px solid #ffffff99;border-radius:50%;background:#ffffff0d;pointer-events:auto}.stick{position:absolute;left:50%;top:50%;width:57px;height:57px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff55;border:2px solid #fff}#kick{position:absolute;right:18px;bottom:40px;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:#e43f48;color:#fff;font-weight:bold;font-size:18px;pointer-events:auto}#chat{position:fixed;z-index:12;left:9px;bottom:8px;width:min(330px,55vw);color:#fff;text-shadow:0 1px 3px #000}.log{max-height:110px;overflow:hidden;font-size:12px;line-height:1.4}.ci{width:100%;height:31px;border:1px solid #ffffff55;border-radius:7px;background:#111a;color:#fff;padding:0 8px;outline:0;touch-action:auto}#status{position:fixed;z-index:15;left:50%;top:45%;transform:translate(-50%,-50%);color:#fff;font-size:30px;font-weight:bold;text-shadow:0 3px 8px #000;pointer-events:none;text-align:center}</style></head><body><canvas id="game"></canvas><div id="lobby"><div class="panel"><h1>⚽ BALL HAX ONLINE</h1><p>Nhập tên người chơi để vào sảnh.</p><input id="name" maxlength="16" placeholder="Tên người chơi" autocomplete="nickname"><button id="join">VÀO PHÒNG</button><div id="err"></div><small>Tối đa 12 người • 6v6 • trận 5 phút</small></div></div><div id="hud" class="hidden"><div id="title">⚽ BALL HAX ONLINE</div><div id="score">0 - 0</div><div id="time">05:00</div></div><div id="count" class="hidden">0/12</div><div id="status"></div><div id="chat" class="hidden"><div id="log" class="log"></div><input id="chatIn" class="ci" maxlength="80" placeholder="Enter để chat..."></div><div id="ctrl" class="controls hidden"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button id="kick">ĐÁ</button></div><script>
'use strict';const c=document.getElementById('game'),x=c.getContext('2d');let ww=innerWidth,hh=innerHeight,d=1;function size(){ww=innerWidth;hh=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=ww*d;c.height=hh*d;c.style.width=ww+'px';c.style.height=hh+'px';x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
const lobby=document.getElementById('lobby'),nameIn=document.getElementById('name'),join=document.getElementById('join'),err=document.getElementById('err'),hud=document.getElementById('hud'),ctrl=document.getElementById('ctrl'),chat=document.getElementById('chat'),count=document.getElementById('count'),score=document.getElementById('score'),time=document.getElementById('time'),status=document.getElementById('status'),log=document.getElementById('log'),chatIn=document.getElementById('chatIn');let ws,myId,joined=false,world={W:1400,H:700,goalH:240,goalDepth:75,playerR:18,ballR:13},S={players:[],ball:{x:700,y:350},score:{red:0,blue:0},mode:'normal',timeLeft:300};const I={up:0,down:0,left:0,right:0,kick:0};
function clean(s){return String(s||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16)}function send(){if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',...I}))}function connect(){let p=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(p+'://'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'name',name:clean(nameIn.value)}));ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){myId=String(m.id)}if(m.type==='error'){err.textContent=m.message}if(m.type==='state'){world=m;S=m;count.textContent=(m.players||[]).length+'/12';score.textContent=(m.score.red||0)+' - '+(m.score.blue||0);let t=Math.ceil(m.timeLeft||0);time.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(m.mode==='golden'){status.textContent='⚡ CƠ HỘI VÀNG';status.style.display='block'}else if(m.message){status.textContent=m.message;status.style.display='block';setTimeout(()=>status.style.display='none',900)}}if(m.type==='chat'){let q=document.createElement('div');q.textContent=(m.name||'Player')+': '+m.text;log.appendChild(q);while(log.children.length>8)log.removeChild(log.firstChild)}}}
join.onclick=()=>{let n=clean(nameIn.value);if(!n){err.textContent='Bạn phải nhập tên.';return}joined=true;lobby.classList.add('hidden');hud.classList.remove('hidden');ctrl.classList.remove('hidden');chat.classList.remove('hidden');count.classList.remove('hidden');connect()};nameIn.onkeydown=e=>{if(e.key==='Enter')join.click()};chatIn.onkeydown=e=>{if(e.key==='Enter'){let t=chatIn.value.trim();if(t&&ws?.readyState===1)ws.send(JSON.stringify({type:'chat',text:t}));chatIn.value=''}};
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let jp=null;function jm(px,py){let r=joy.getBoundingClientRect(),dx=px-(r.left+r.width/2),dy=py-(r.top+r.height/2),m=r.width/2-29,z=Math.hypot(dx,dy);if(z>m){dx=dx/z*m;dy=dy/z*m}let q=m*.18;I.left=dx<-q;I.right=dx>q;I.up=dy<-q;I.down=dy>q;stick.style.left='calc(50% + '+dx+'px)';stick.style.top='calc(50% + '+dy+'px)';send()}function jr(){I.left=I.right=I.up=I.down=0;stick.style.left='50%';stick.style.top='50%';send()}joy.onpointerdown=e=>{jp=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e.clientX,e.clientY)};joy.onpointermove=e=>{if(e.pointerId===jp)jm(e.clientX,e.clientY)};joy.onpointerup=e=>{if(e.pointerId===jp){jp=null;jr()}};joy.onpointercancel=()=>{jp=null;jr()};document.getElementById('kick').onpointerdown=e=>{e.preventDefault();I.kick=1;send()};
const K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;I.up=K.arrowup||K.w;I.down=K.arrowdown||K.s;I.left=K.arrowleft||K.a;I.right=K.arrowright||K.d;I.kick=e.key===' ';send()});addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0;I.up=K.arrowup||K.w;I.down=K.arrowdown||K.s;I.left=K.arrowleft||K.a;I.right=K.arrowright||K.d;I.kick=0;send()});
function sc(){return Math.min((ww-20)/world.W,(hh-70)/world.H)}function X(v){return ww/2+(v-world.W/2)*sc()}function Y(v){return hh/2+(v-world.H/2)*sc()}function field(){let s=sc(),l=X(0),t=Y(0),w=world.W*s,h=world.H*s;x.clearRect(0,0,ww,hh);x.fillStyle='#168b45';x.fillRect(l,t,w,h);for(let i=0;i<14;i++){x.fillStyle=i%2?'#fff1':'#0001';x.fillRect(l+i*w/14,t,w/14,h)}x.strokeStyle='#fffd';x.lineWidth=3;x.strokeRect(l,t,w,h);x.beginPath();x.moveTo(X(world.W/2),t);x.lineTo(X(world.W/2),t+h);x.stroke();x.beginPath();x.arc(X(world.W/2),Y(world.H/2),90*s,0,7);x.stroke();x.strokeRect(X(0),Y((world.H-330)/2),190*s,330*s);x.strokeRect(X(world.W-190),Y((world.H-330)/2),190*s,330*s);goal(0,s);goal(world.W,s)}function goal(g,s){let y=(world.H-world.goalH)/2;let gx=g===0?-world.goalDepth:world.W;x.fillStyle='#fff2';x.fillRect(X(gx),Y(y),world.goalDepth*s,world.goalH*s);x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(X(gx),Y(y),world.goalDepth*s,world.goalH*s)}function player(p){let s=sc(),r=world.playerR*s,px=X(p.x),py=Y(p.y),col=p.team==='red'?'#e43e45':'#3477f5';x.beginPath();x.arc(px+2,py+3,r,0,7);x.fillStyle='#0005';x.fill();x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=col;x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.beginPath();x.arc(px,py,r*.2,0,7);x.fillStyle='#fffb';x.fill();if(String(p.id)===String(myId)){x.beginPath();x.arc(px,py,r+4,0,7);x.strokeStyle='#ffe66d';x.stroke()}x.font='bold 11px Arial';x.textAlign='center';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=3;x.fillText(p.name||'Player',px,py-r-7);x.shadowBlur=0}function ball(){let s=sc(),r=world.ballR*s,px=X(S.ball.x),py=Y(S.ball.y);x.beginPath();x.arc(px+2,py+3,r,0,7);x.fillStyle='#0004';x.fill();x.beginPath();x.arc(px,py,r,0,7);x.fillStyle='#fff';x.fill();x.strokeStyle='#222';x.stroke();x.beginPath();x.arc(px,py,r*.22,0,7);x.fillStyle='#222';x.fill()}function draw(){field();(S.players||[]).forEach(player);ball();requestAnimationFrame(draw)}draw();nameIn.focus();
</script></body></html>
