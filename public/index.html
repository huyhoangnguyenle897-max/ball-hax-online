<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ball Hax Online</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#168b45;
  font-family:Arial
}

canvas{
  display:block;
  width:100%;
  height:100%
}

#ui{
  position:fixed;
  top:8px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-weight:bold;
  text-shadow:0 2px 4px #000
}

#joy,#kick{
  display:none;
  position:fixed;
  bottom:35px
}

#joy{
  left:20px;
  width:110px;
  height:110px;
  border:2px solid #fff8;
  border-radius:50%
}

#kick{
  right:20px;
  width:85px;
  height:85px;
  border:2px solid white;
  border-radius:50%;
  background:#e44;
  color:white;
  font-weight:bold
}

@media(max-width:800px){
  #joy,#kick{
    display:block
  }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ui">
  ⚽ BALL HAX ONLINE<br>
  <span id="score">0 - 0</span>
  •
  <span id="time">05:00</span>
</div>

<div id="joy"></div>
<button id="kick">ĐÁ</button>

<script>
const c=document.getElementById('c'),
x=c.getContext('2d'),
score=document.getElementById('score'),
time=document.getElementById('time');

let ws,me,state;

let keys={
  up:0,
  down:0,
  left:0,
  right:0,
  kick:0
};

function size(){
  c.width=innerWidth*devicePixelRatio;
  c.height=innerHeight*devicePixelRatio
}

size();
onresize=size;

function send(){
  if(ws&&ws.readyState===1)
    ws.send(JSON.stringify({
      type:'input',
      ...keys
    }))
}

ws=new WebSocket(
  (location.protocol==='https:'?'wss':'ws')
  +'://'+location.host
);

ws.onmessage=e=>{
  let m=JSON.parse(e.data);

  if(m.type==='welcome')
    me=m.id;

  if(m.type==='state'){
    state=m;

    score.textContent=
      m.score.blue+' - '+m.score.red;

    time.textContent=
      m.mode==='golden'
      ?'GOLDEN'
      :fmt(m.timeLeft)
  }
};

onkeydown=e=>{
  let k=e.key.toLowerCase();

  if(k==='w'||k==='arrowup')
    keys.up=1;

  if(k==='s'||k==='arrowdown')
    keys.down=1;

  if(k==='a'||k==='arrowleft')
    keys.left=1;

  if(k==='d'||k==='arrowright')
    keys.right=1;

  if(k===' ')
    keys.kick=1;

  send()
};

onkeyup=e=>{
  let k=e.key.toLowerCase();

  if(k==='w'||k==='arrowup')
    keys.up=0;

  if(k==='s'||k==='arrowdown')
    keys.down=0;

  if(k==='a'||k==='arrowleft')
    keys.left=0;

  if(k==='d'||k==='arrowright')
    keys.right=0;

  if(k===' ')
    keys.kick=0;

  send()
};

function fmt(s){
  s=Math.max(0,Math.ceil(s));

  return String(Math.floor(s/60)).padStart(2,'0')
    +':'
    +String(s%60).padStart(2,'0')
}

function draw(){

  requestAnimationFrame(draw);

  if(!state)return;

  let W=state.W,
      H=state.H,
      s=Math.min(
        innerWidth/W,
        innerHeight/H
      ),
      ox=(innerWidth-W*s)/2,
      oy=(innerHeight-H*s)/2;

  x.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  x.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );

  x.save();

  x.translate(ox,oy);
  x.scale(s,s);

  x.fillStyle='#168b45';
  x.fillRect(0,0,W,H);

  x.strokeStyle='white';
  x.lineWidth=5;
  x.strokeRect(0,0,W,H);

  x.beginPath();
  x.moveTo(W/2,0);
  x.lineTo(W/2,H);
  x.stroke();

  x.beginPath();
  x.arc(
    W/2,
    H/2,
    75,
    0,
    7
  );
  x.stroke();

  x.fillStyle='white';

  x.beginPath();
  x.arc(
    state.ball.x,
    state.ball.y,
    13,
    0,
    7
  );
  x.fill();

  for(const p of state.players){

    x.fillStyle=
      p.team==='blue'
      ?'#1680ff'
      :'#ef3333';

    x.beginPath();

    x.arc(
      p.x,
      p.y,
      18,
      0,
      7
    );

    x.fill();

    x.fillStyle='white';
    x.font='12px Arial';
    x.textAlign='center';

    x.fillText(
      p.name,
      p.x,
      p.y-24
    );
  }

  x.restore()
}

draw();
</script>

</body>
</html>
