<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Ball Hax Online</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

body {
    user-select: none;
}

/* =====================================================
   GAME CANVAS
===================================================== */

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #168b45;
}

/* =====================================================
   LOBBY
===================================================== */

#lobby {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            rgba(25,150,75,.45),
            rgba(0,0,0,.92)
        );
}

.lobbyBox {
    width: min(420px, 92vw);
    padding: 28px 22px 24px;

    border-radius: 20px;

    background: rgba(20,20,20,.94);

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        0 20px 60px rgba(0,0,0,.6);

    text-align: center;

    color: white;
}

.lobbyBall {
    font-size: 48px;
    margin-bottom: 4px;
}

.lobbyTitle {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 6px;
}

.lobbySubtitle {
    color: rgba(255,255,255,.65);
    font-size: 13px;
    margin-bottom: 22px;
}

#nameInput {
    width: 100%;
    height: 50px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;

    outline: none;

    background: rgba(255,255,255,.08);

    color: white;

    padding: 0 15px;

    font-size: 16px;

    text-align: center;
}

#nameInput::placeholder {
    color: rgba(255,255,255,.4);
}

#joinButton {
    width: 100%;
    height: 50px;

    margin-top: 12px;

    border: 0;
    border-radius: 12px;

    background: #19a653;

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

#joinButton:active {
    transform: scale(.97);
}

#lobbyError {
    min-height: 20px;

    margin-top: 12px;

    color: #ff6666;

    font-size: 13px;
}

/* =====================================================
   SCOREBOARD
===================================================== */

#scoreboard {
    position: fixed;

    top: max(8px, env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: white;

    text-align: center;

    font-weight: bold;

    text-shadow:
        0 2px 4px rgba(0,0,0,.9);

    pointer-events: none;
}

#title {
    font-size: 19px;
}

#score {
    font-size: 20px;

    margin-top: 1px;
}

#time {
    font-size: 16px;

    margin-top: 1px;
}

#roundMode {
    font-size: 11px;

    color: rgba(255,255,255,.72);

    margin-top: 2px;
}

/* =====================================================
   STATUS
===================================================== */

#status {
    position: fixed;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    z-index: 30;

    display: none;

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-align: center;

    text-shadow:
        0 3px 8px rgba(0,0,0,.9);

    pointer-events: none;

    white-space: nowrap;
}

/* =====================================================
   JOYSTICK
===================================================== */

#joystick {
    position: fixed;

    left: 24px;

    bottom:
        calc(28px + env(safe-area-inset-bottom));

    width: 135px;
    height: 135px;

    border:
        3px solid rgba(255,255,255,.58);

    border-radius: 50%;

    background:
        rgba(255,255,255,.035);

    z-index: 40;

    touch-action: none;
}

#stick {
    position: absolute;

    width: 58px;
    height: 58px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,.32);

    border:
        2px solid rgba(255,255,255,.75);

    pointer-events: none;
}

/* =====================================================
   KICK
===================================================== */

#kick {
    position: fixed;

    right: 24px;

    bottom:
        calc(28px + env(safe-area-inset-bottom));

    width: 104px;
    height: 104px;

    border-radius: 50%;

    border: 3px solid white;

    background: #ef4148;

    color: white;

    font-size: 18px;

    font-weight: bold;

    z-index: 40;

    box-shadow:
        0 5px 15px rgba(0,0,0,.35);

    touch-action: none;
}

#kick:active {
    transform: scale(.93);
    background: #d72e35;
}

/* =====================================================
   HELP
===================================================== */

#help {
    position: fixed;

    left: 50%;

    bottom:
        calc(7px + env(safe-area-inset-bottom));

    transform: translateX(-50%);

    color:
        rgba(255,255,255,.62);

    font-size: 11px;

    z-index: 25;

    pointer-events: none;

    white-space: nowrap;
}

/* =====================================================
   CHAT
===================================================== */

#chat {
    position: fixed;

    left: 12px;

    top: 90px;

    width: min(290px, 48vw);

    z-index: 50;

    pointer-events: auto;
}

#chatMessages {
    max-height: 145px;

    overflow: hidden;

    color: white;

    font-size: 12px;

    text-shadow:
        0 1px 3px black;
}

.chatLine {
    margin-bottom: 3px;

    word-break: break-word;
}

.chatName {
    font-weight: bold;
}

#chatForm {
    display: flex;

    margin-top: 5px;

    gap: 4px;
}

#chatInput {
    min-width: 0;

    flex: 1;

    height: 30px;

    border: 1px solid rgba(255,255,255,.25);

    border-radius: 8px;

    background: rgba(0,0,0,.38);

    color: white;

    padding: 0 8px;

    outline: none;

    font-size: 12px;
}

#chatSend {
    width: 42px;

    border: 0;

    border-radius: 8px;

    background: rgba(255,255,255,.2);

    color: white;
}

/* =====================================================
   PLAYER LIST
===================================================== */

#playerList {
    position: fixed;

    right: 10px;

    top: 85px;

    z-index: 20;

    color: white;

    font-size: 11px;

    text-align: right;

    pointer-events: none;

    text-shadow:
        0 1px 3px black;
}

.teamBlue {
    color: #75a5ff;
}

.teamRed {
    color: #ff7070;
}

/* =====================================================
   DISCONNECT
===================================================== */

#connection {
    position: fixed;

    left: 50%;

    top: 5px;

    transform: translateX(-50%);

    z-index: 60;

    display: none;

    padding: 5px 10px;

    border-radius: 8px;

    background: rgba(180,0,0,.8);

    color: white;

    font-size: 11px;
}

/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 900px) {

    #joystick {
        left: 40px;
        bottom: 40px;
    }

    #kick {
        right: 40px;
        bottom: 40px;
    }

    #help {
        bottom: 12px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- =====================================================
     LOBBY
===================================================== -->

<div id="lobby">

    <div class="lobbyBox">

        <div class="lobbyBall">
            ⚽
        </div>

        <div class="lobbyTitle">
            BALL HAX ONLINE
        </div>

        <div class="lobbySubtitle">
            Nhập tên của bạn để vào phòng
        </div>

        <input
            id="nameInput"
            maxlength="16"
            autocomplete="off"
            placeholder="Tên người chơi"
        >

        <button id="joinButton">
            VÀO TRẬN
        </button>

        <div id="lobbyError"></div>

    </div>

</div>


<!-- =====================================================
     SCORE
===================================================== -->

<div id="scoreboard">

    <div id="title">
        ⚽ BALL HAX ONLINE
    </div>

    <div id="score">
        0 - 0
    </div>

    <div id="time">
        05:00
    </div>

    <div id="roundMode">
        Vòng 1
    </div>

</div>


<div id="status"></div>

<div id="connection">
    Mất kết nối máy chủ
</div>


<!-- =====================================================
     CHAT
===================================================== -->

<div id="chat">

    <div id="chatMessages"></div>

    <form id="chatForm">

        <input
            id="chatInput"
            maxlength="80"
            autocomplete="off"
            placeholder="Chat..."
        >

        <button id="chatSend">
            ➤
        </button>

    </form>

</div>


<!-- =====================================================
     PLAYER LIST
===================================================== -->

<div id="playerList"></div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div id="joystick">

    <div id="stick"></div>

</div>


<button id="kick">
    ĐÁ
</button>


<div id="help">
    Kéo vòng tròn để di chuyển • Nhấn ĐÁ để sút
</div>


<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


let W =
    window.innerWidth;

let H =
    window.innerHeight;


let DPR = 1;


function resize() {

    W = window.innerWidth;

    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);


resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD = {

    width: 1400,

    height: 700,

    goalHeight: 240,

    goalDepth: 70,

    playerRadius: 18,

    ballRadius: 13

};


/* =====================================================
   GAME STATE
===================================================== */

let myId = null;

let myName = "";

let joined = false;

let gameState = {

    W: WORLD.width,

    H: WORLD.height,

    score: {
        blue: 0,
        red: 0
    },

    round: 1,

    mode: "normal",

    timeLeft: 300,

    ball: {
        x: 700,
        y: 350
    },

    players: []

};


/* =====================================================
   WEBSOCKET
===================================================== */

let socket = null;

let reconnectTimer = null;


function getSocketURL() {

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    return (
        protocol +
        "//" +
        location.host
    );
}


function connectSocket() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||

            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {

        return;

    }


    try {

        socket =
            new WebSocket(
                getSocketURL()
            );


        socket.addEventListener(
            "open",
            () => {

                document
                    .getElementById(
                        "connection"
                    )
                    .style.display =
                    "none";


                if (myName) {

                    sendName();

                }

            }
        );


        socket.addEventListener(
            "message",
            event => {

                handleMessage(
                    event.data
                );

            }
        );


        socket.addEventListener(
            "close",
            () => {

                document
                    .getElementById(
                        "connection"
                    )
                    .style.display =
                    joined
                    ? "block"
                    : "none";


                scheduleReconnect();

            }
        );


        socket.addEventListener(
            "error",
            () => {

                document
                    .getElementById(
                        "connection"
                    )
                    .style.display =
                    joined
                    ? "block"
                    : "none";

            }
        );


    } catch (error) {

        console.log(error);

        scheduleReconnect();

    }

}


function scheduleReconnect() {

    if (reconnectTimer)
        return;


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectSocket();

            },
            2000
        );

}


/* =====================================================
   SERVER MESSAGE
===================================================== */

function handleMessage(raw) {

    try {

        const message =
            JSON.parse(raw);


        if (
            message.type ===
            "welcome"
        ) {

            myId =
                String(message.id);

            return;

        }


        if (
            message.type ===
            "state"
        ) {

            gameState =
                message;

            return;

        }


        if (
            message.type ===
            "chat"
        ) {

            addChatMessage(
                message.name,
                message.text
            );

            return;

        }


        if (
            message.type ===
            "error"
        ) {

            showLobbyError(
                message.message ||
                "Không thể vào phòng."
            );

        }

    } catch (error) {

        console.log(
            "Invalid server message",
            error
        );

    }

}


/* =====================================================
   SEND
===================================================== */

function send(data) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return false;

    }


    try {

        socket.send(
            JSON.stringify(data)
        );

        return true;

    } catch {

        return false;

    }

}


function sendName() {

    if (!myName)
        return;

    send({

        type: "name",

        name: myName

    });

}


/* =====================================================
   LOBBY
===================================================== */

const lobby =
    document.getElementById(
        "lobby"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const lobbyError =
    document.getElementById(
        "lobbyError"
    );


function showLobbyError(text) {

    lobbyError.textContent =
        text;

}


function joinGame() {

    const name =
        nameInput.value
            .trim()
            .replace(
                /[<>]/g,
                ""
            )
            .slice(0, 16);


    if (!name) {

        showLobbyError(
            "Bạn chưa nhập tên."
        );

        nameInput.focus();

        return;

    }


    myName =
        name;


    joined = true;


    lobby.style.display =
        "none";


    connectSocket();


    setTimeout(
        sendName,
        200
    );

}


joinButton.addEventListener(
    "click",
    joinGame
);


nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            joinGame();

        }

    }
);


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


const input = {

    up: false,

    down: false,

    left: false,

    right: false,

    kick: false

};


let joystickPointer =
    null;


function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;


    let dy =
        clientY -
        centerY;


    const max =
        rect.width / 2 -
        30;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (distance > max) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;

    }


    const deadZone =
        7;


    if (
        Math.hypot(dx, dy) <
        deadZone
    ) {

        dx = 0;
        dy = 0;

    }


    input.left =
        dx < -max * .22;

    input.right =
        dx > max * .22;

    input.up =
        dy < -max * .22;

    input.down =
        dy > max * .22;


    stick.style.left =
        `calc(50% + ${dx}px)`;


    stick.style.top =
        `calc(50% + ${dy}px)`;

}


function resetJoystick() {

    input.up = false;
    input.down = false;
    input.left = false;
    input.right = false;


    stick.style.left =
        "50%";


    stick.style.top =
        "50%";

}


joystick.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        joystickPointer =
            event.pointerId;


        joystick.setPointerCapture(
            event.pointerId
        );


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            joystickPointer
        )
            return;


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


function endJoystick(event) {

    if (
        event.pointerId !==
        joystickPointer
    )
        return;


    joystickPointer =
        null;


    resetJoystick();

}


joystick.addEventListener(
    "pointerup",
    endJoystick
);


joystick.addEventListener(
    "pointercancel",
    endJoystick
);


/* =====================================================
   KICK
===================================================== */

const kickButton =
    document.getElementById(
        "kick"
    );


function kickDown(event) {

    event.preventDefault();

    input.kick = true;

    sendInput();

}


function kickUp(event) {

    event.preventDefault();

    input.kick = false;

    sendInput();

}


kickButton.addEventListener(
    "pointerdown",
    kickDown
);


kickButton.addEventListener(
    "pointerup",
    kickUp
);


kickButton.addEventListener(
    "pointercancel",
    kickUp
);


kickButton.addEventListener(
    "pointerleave",
    kickUp
);


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            event.key.startsWith(
                "Arrow"
            ) ||
            event.key === " "
        ) {

            event.preventDefault();

        }


        if (
            event.key === " "
        ) {

            input.kick = true;

            sendInput();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;


        if (
            event.key === " "
        ) {

            input.kick = false;

            sendInput();

        }

    }
);


function updateKeyboard() {

    const keyboard = {

        up:
            !!(
                keys["arrowup"] ||
                keys["w"]
            ),

        down:
            !!(
                keys["arrowdown"] ||
                keys["s"]
            ),

        left:
            !!(
                keys["arrowleft"] ||
                keys["a"]
            ),

        right:
            !!(
                keys["arrowright"] ||
                keys["d"]
            )

    };


    /*
     * Bàn phím chỉ bổ sung
     * cho joystick.
     */

    input.up =
        input.up ||
        keyboard.up;

    input.down =
        input.down ||
        keyboard.down;

    input.left =
        input.left ||
        keyboard.left;

    input.right =
        input.right ||
        keyboard.right;

}


/* =====================================================
   SEND INPUT
===================================================== */

let lastInputSend =
    0;


function sendInput(force = false) {

    const now =
        performance.now();


    if (
        !force &&
        now - lastInputSend <
        30
    ) {

        return;

    }


    lastInputSend =
        now;


    send({

        type: "input",

        up: !!input.up,

        down: !!input.down,

        left: !!input.left,

        right: !!input.right,

        kick: !!input.kick

    });

}


/* =====================================================
   CHAT
===================================================== */

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );


chatForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const text =
            chatInput.value
                .trim()
                .slice(0, 80);


        if (!text)
            return;


        send({

            type: "chat",

            text

        });


        chatInput.value =
            "";

    }
);


function addChatMessage(
    name,
    text
) {

    const line =
        document.createElement(
            "div"
        );


    line.className =
        "chatLine";


    const nameElement =
        document.createElement(
            "span"
        );


    nameElement.className =
        "chatName";


    nameElement.textContent =
        name + ": ";


    const textElement =
        document.createElement(
            "span"
        );


    textElement.textContent =
        text;


    line.appendChild(
        nameElement
    );


    line.appendChild(
        textElement
    );


    chatMessages.appendChild(
        line
    );


    while (
        chatMessages.children.length >
        8
    ) {

        chatMessages.removeChild(
            chatMessages.firstChild
        );

    }


    setTimeout(
        () => {

            if (line.parentNode) {

                line.style.opacity =
                    "0.35";

            }

        },
        7000
    );

}


/* =====================================================
   GAME SCALE
===================================================== */

function getScale() {

    const marginX = 18;

    /*
     * Chừa chỗ scoreboard và
     * nút điều khiển.
     */

    const availableWidth =
        W -
        marginX * 2;


    const availableHeight =
        H -
        105;


    return Math.min(

        availableWidth /
        WORLD.width,

        availableHeight /
        WORLD.height

    );

}


/* =====================================================
   WORLD TO SCREEN
===================================================== */

function worldToScreen(
    x,
    y
) {

    const scale =
        getScale();


    /*
     * Server dùng:
     *
     * x = 0 -> biên trái
     * x = 1400 -> biên phải
     *
     * y = 0 -> trên
     * y = 700 -> dưới
     */

    const left =
        W / 2 -
        WORLD.width *
        scale / 2;


    const top =
        H / 2 -
        WORLD.height *
        scale / 2;


    return {

        x:
            left +
            x * scale,

        y:
            top +
            y * scale

    };

}


/* =====================================================
   FIELD
===================================================== */

function drawField() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const scale =
        getScale();


    const left =
        W / 2 -
        WORLD.width *
        scale / 2;


    const top =
        H / 2 -
        WORLD.height *
        scale / 2;


    const width =
        WORLD.width *
        scale;


    const height =
        WORLD.height *
        scale;


    /*
     * Grass
     */

    ctx.fillStyle =
        "#168f47";


    ctx.fillRect(
        left,
        top,
        width,
        height
    );


    /*
     * Grass stripes
     */

    const stripeCount =
        14;


    for (
        let i = 0;
        i < stripeCount;
        i++
    ) {

        ctx.fillStyle =
            i % 2 === 0
            ? "rgba(255,255,255,.025)"
            : "rgba(0,0,0,.025)";


        ctx.fillRect(

            left +
            i *
            width /
            stripeCount,

            top,

            width /
            stripeCount,

            height

        );

    }


    /*
     * Outer lines
     */

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";


    ctx.lineWidth =
        Math.max(
            2,
            3 * scale
        );


    ctx.strokeRect(
        left,
        top,
        width,
        height
    );


    /*
     * Halfway
     */

    ctx.beginPath();

    ctx.moveTo(
        W / 2,
        top
    );

    ctx.lineTo(
        W / 2,
        top + height
    );

    ctx.stroke();


    /*
     * Center circle
     */

    ctx.beginPath();

    ctx.arc(
        W / 2,
        H / 2,
        92 * scale,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
     * Center point
     */

    ctx.beginPath();

    ctx.arc(
        W / 2,
        H / 2,
        Math.max(
            2.5,
            4 * scale
        ),
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    drawPenaltyAreas(
        scale,
        left,
        top
    );


    drawGoals(
        scale,
        left,
        top
    );

}


/* =====================================================
   PENALTY AREAS
===================================================== */

function drawPenaltyAreas(
    scale,
    left,
    top
) {

    const boxWidth =
        180;

    const boxHeight =
        360;


    const y =
        350 -
        boxHeight / 2;


    ctx.strokeStyle =
        "rgba(255,255,255,.78)";


    ctx.lineWidth =
        Math.max(
            2,
            2 * scale
        );


    /*
     * Left
     */

    ctx.strokeRect(

        left,

        top +
        y * scale,

        boxWidth *
        scale,

        boxHeight *
        scale

    );


    /*
     * Right
     */

    ctx.strokeRect(

        left +
        (WORLD.width -
        boxWidth) *
        scale,

        top +
        y * scale,

        boxWidth *
        scale,

        boxHeight *
        scale

    );

}


/* =====================================================
   GOALS
===================================================== */

function drawGoals(
    scale,
    left,
    top
) {

    const goalHeight =
        WORLD.goalHeight;


    const goalDepth =
        WORLD.goalDepth;


    const goalY =
        350 -
        goalHeight / 2;


    /*
     * LEFT GOAL
     */

    ctx.fillStyle =
        "rgba(255,255,255,.13)";


    ctx.fillRect(

        left -
        goalDepth * scale,

        top +
        goalY * scale,

        goalDepth * scale,

        goalHeight * scale

    );


    ctx.strokeStyle =
        "rgba(255,255,255,.95)";


    ctx.lineWidth =
        Math.max(
            2,
            3 * scale
        );


    ctx.strokeRect(

        left -
        goalDepth * scale,

        top +
        goalY * scale,

        goalDepth * scale,

        goalHeight * scale

    );


    /*
     * RIGHT GOAL
     */

    ctx.fillStyle =
        "rgba(255,255,255,.13)";


    ctx.fillRect(

        left +
        WORLD.width *
        scale,

        top +
        goalY * scale,

        goalDepth * scale,

        goalHeight * scale

    );


    ctx.strokeStyle =
        "rgba(255,255,255,.95)";


    ctx.strokeRect(

        left +
        WORLD.width *
        scale,

        top +
        goalY * scale,

        goalDepth * scale,

        goalHeight * scale

    );

}


/* =====================================================
   BALL
===================================================== */

function drawBall() {

    if (!gameState.ball)
        return;


    const p =
        worldToScreen(
            gameState.ball.x,
            gameState.ball.y
        );


    const scale =
        getScale();


    const radius =
        WORLD.ballRadius *
        scale;


    /*
     * Shadow
     */

    ctx.beginPath();

    ctx.ellipse(

        p.x + 2,

        p.y + 4,

        radius * 1.05,

        radius * .7,

        0,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(0,0,0,.28)";

    ctx.fill();


    /*
     * White ball
     */

    ctx.beginPath();

    ctx.arc(

        p.x,

        p.y,

        radius,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#f5f5f5";

    ctx.fill();


    ctx.strokeStyle =
        "#222";

    ctx.lineWidth =
        Math.max(
            1,
            1.5 * scale
        );

    ctx.stroke();


    /*
     * HaxBall-style
     * simple black details
     */

    ctx.fillStyle =
        "#222";


    /*
     * Center pentagon-like mark
     */

    drawBallPatch(
        p.x,
        p.y,
        radius * .28
    );


    /*
     * Small patches
     */

    const patches = [

        [-.58, -.28],

        [.58, -.28],

        [-.48, .52],

        [.48, .52]

    ];


    for (
        const patch of patches
    ) {

        drawBallPatch(

            p.x +
            patch[0] *
            radius,

            p.y +
            patch[1] *
            radius,

            radius * .13

        );

    }

}


function drawBallPatch(
    x,
    y,
    r
) {

    ctx.beginPath();

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const angle =
            -Math.PI / 2 +
            i *
            Math.PI * 2 / 5;


        const px =
            x +
            Math.cos(angle) *
            r;


        const py =
            y +
            Math.sin(angle) *
            r;


        if (i === 0)
            ctx.moveTo(px, py);
        else
            ctx.lineTo(px, py);

    }

    ctx.closePath();

    ctx.fill();

}


/* =====================================================
   PLAYER DISC
===================================================== */

function drawPlayer(
    player
) {

    const p =
        worldToScreen(
            player.x,
            player.y
        );


    const scale =
        getScale();


    const r =
        WORLD.playerRadius *
        scale;


    const isMe =
        String(player.id) ===
        String(myId);


    /*
     * Shadow
     */

    ctx.beginPath();

    ctx.ellipse(

        p.x + 2,

        p.y + 4,

        r * 1.05,

        r * .72,

        0,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.fill();


    /*
     * Outer disc
     */

    ctx.beginPath();

    ctx.arc(

        p.x,

        p.y,

        r,

        0,

        Math.PI * 2

    );


    if (
        player.team ===
        "red"
    ) {

        ctx.fillStyle =
            "#e94343";

    } else {

        ctx.fillStyle =
            "#3d78ff";

    }


    ctx.fill();


    /*
     * White outline
     */

    ctx.strokeStyle =
        isMe
        ? "#ffffff"
        : "rgba(255,255,255,.72)";


    ctx.lineWidth =
        isMe
        ? Math.max(
            2.5,
            3 * scale
        )
        : Math.max(
            1.5,
            2 * scale
        );


    ctx.stroke();


    /*
     * Inner highlight
     */

    ctx.beginPath();

    ctx.arc(

        p.x -
        r * .25,

        p.y -
        r * .25,

        r * .52,

        Math.PI,

        Math.PI * 1.5

    );


    ctx.strokeStyle =
        "rgba(255,255,255,.22)";


    ctx.lineWidth =
        Math.max(
            1,
            2 * scale
        );


    ctx.stroke();


    /*
     * Tên
     */

    ctx.font =
        `bold ${
            Math.max(
                9,
                11 * scale
            )
        }px Arial`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "white";


    ctx.shadowColor =
        "rgba(0,0,0,.9)";


    ctx.shadowBlur =
        3;


    ctx.fillText(

        String(
            player.name ||
            "Player"
        ).slice(0,16),

        p.x,

        p.y -
        r -
        9

    );


    ctx.shadowBlur =
        0;


    /*
     * Viền sáng quanh người chơi
     * của chính mình.
     */

    if (isMe) {

        ctx.beginPath();

        ctx.arc(

            p.x,

            p.y,

            r + 5,

            0,

            Math.PI * 2

        );


        ctx.strokeStyle =
            "rgba(255,255,255,.35)";


        ctx.lineWidth = 2;

        ctx.stroke();

    }

}


/* =====================================================
   PLAYER LIST
===================================================== */

function updatePlayerList() {

    const element =
        document.getElementById(
            "playerList"
        );


    const players =
        gameState.players ||
        [];


    let blue = [];

    let red = [];


    for (
        const player of players
    ) {

        if (
            player.team ===
            "blue"
        ) {

            blue.push(player);

        } else {

            red.push(player);

        }

    }


    let html = "";


    html +=
        `<div class="teamBlue">
            🔵 ${blue.length}
        </div>`;


    html +=
        `<div class="teamRed">
            🔴 ${red.length}
        </div>`;


    element.innerHTML =
        html;

}


/* =====================================================
   SCOREBOARD
===================================================== */

function updateScoreboard() {

    const score =
        gameState.score ||
        {
            blue: 0,
            red: 0
        };


    document.getElementById(
        "score"
    ).textContent =
        `${score.blue} - ${score.red}`;


    let time =
        Number(
            gameState.timeLeft
        );


    if (
        !Number.isFinite(time)
    ) {

        time = 300;

    }


    time =
        Math.max(
            0,
            time
        );


    const minutes =
        Math.floor(
            time / 60
        );


    const seconds =
        Math.floor(
            time % 60
        );


    document.getElementById(
        "time"
    ).textContent =

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(seconds)
            .padStart(2, "0");


    const mode =
        gameState.mode;


    const round =
        gameState.round ||
        1;


    document.getElementById(
        "roundMode"
    ).textContent =

        mode === "golden"

        ? `Vòng ${round} • CƠ HỘI VÀNG`

        : `Vòng ${round}`;

}


/* =====================================================
   GOAL / MODE STATUS
===================================================== */

let previousMode =
    "normal";


let previousScoreBlue =
    0;


let previousScoreRed =
    0;


function detectEvents() {

    const mode =
        gameState.mode;


    const blue =
        gameState.score.blue;


    const red =
        gameState.score.red;


    if (
        mode !==
        previousMode
    ) {

        if (
            mode ===
            "golden"
        ) {

            showStatus(
                "⚡ CƠ HỘI VÀNG ⚡",
                2200
            );

        }

    }


    if (
        blue !==
        previousScoreBlue
    ) {

        showStatus(
            "🔵 GOOOOOL!",
            1200
        );

    }


    if (
        red !==
        previousScoreRed
    ) {

        showStatus(
            "🔴 GOOOOOL!",
            1200
        );

    }


    previousMode =
        mode;


    previousScoreBlue =
        blue;


    previousScoreRed =
        red;

}


let statusTimer =
    null;


function showStatus(
    text,
    duration
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        text;


    status.style.display =
        "block";


    clearTimeout(
        statusTimer
    );


    statusTimer =
        setTimeout(
            () => {

                status.style.display =
                    "none";

            },
            duration
        );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    drawField();


    const players =
        gameState.players ||
        [];


    /*
     * Vẽ cầu thủ trước
     */

    for (
        const player of players
    ) {

        drawPlayer(player);

    }


    /*
     * Bóng nằm trên cầu thủ
     * để dễ nhìn.
     */

    drawBall();


    updateScoreboard();

    updatePlayerList();

    detectEvents();

}


/* =====================================================
   INPUT LOOP
===================================================== */

let lastInputTick =
    0;


function inputLoop(now) {

    updateKeyboard();


    if (
        now -
        lastInputTick >
        40
    ) {

        sendInput();

        lastInputTick =
            now;

    }


    requestAnimationFrame(
        inputLoop
    );

}


/* =====================================================
   START
===================================================== */

nameInput.focus();


connectSocket();


requestAnimationFrame(
    inputLoop
);


/* =====================================================
   GAME RENDER LOOP
===================================================== */

function renderLoop() {

    render();

    requestAnimationFrame(
        renderLoop
    );

}


requestAnimationFrame(
    renderLoop
);

</script>
