<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Ball Hax Online</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;

    touch-action: none;
}

body {
    user-select: none;
}

/* =====================================================
   GAME CANVAS
===================================================== */

#game {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #168a45;
}

/* =====================================================
   LOBBY
===================================================== */

#lobby {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #168a45 0%,
            #087036 45%,
            #064526 100%
        );
}

#lobbyBox {
    width: min(90vw, 390px);

    padding: 28px 24px 25px;

    border-radius: 18px;

    background: rgba(0, 0, 0, .48);

    border: 1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    text-align: center;

    color: white;
}

#lobbyTitle {
    font-size: 27px;

    font-weight: bold;

    margin-bottom: 7px;

    text-shadow:
        0 3px 8px rgba(0,0,0,.6);
}

#lobbySubtitle {
    font-size: 13px;

    color:
        rgba(255,255,255,.7);

    margin-bottom: 23px;
}

#nameInput {
    width: 100%;

    height: 48px;

    padding: 0 15px;

    border-radius: 10px;

    border: 2px solid
        rgba(255,255,255,.2);

    outline: none;

    background:
        rgba(255,255,255,.1);

    color: white;

    font-size: 16px;

    text-align: center;
}

#nameInput::placeholder {
    color:
        rgba(255,255,255,.5);
}

#nameInput:focus {
    border-color:
        rgba(255,255,255,.7);
}

#joinButton {
    width: 100%;

    height: 50px;

    margin-top: 12px;

    border: 0;

    border-radius: 10px;

    background: #ef4148;

    color: white;

    font-size: 17px;

    font-weight: bold;

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);
}

#joinButton:active {
    transform: scale(.97);
}

#connectionStatus {
    margin-top: 14px;

    min-height: 18px;

    font-size: 12px;

    color:
        rgba(255,255,255,.65);
}

/* =====================================================
   SCOREBOARD
===================================================== */

#scoreboard {
    position: fixed;

    top: 8px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    color: white;

    text-align: center;

    font-weight: bold;

    text-shadow:
        0 2px 3px rgba(0,0,0,.8),
        0 0 5px rgba(0,0,0,.5);

    pointer-events: none;

    user-select: none;
}

#title {
    font-size: 20px;
}

#score {
    font-size: 19px;
}

#time {
    font-size: 17px;
}

#round {
    font-size: 12px;

    margin-top: 1px;

    color:
        rgba(255,255,255,.8);
}

/* =====================================================
   STATUS
===================================================== */

#status {
    position: fixed;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%);

    z-index: 30;

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-shadow:
        0 3px 6px black;

    display: none;

    pointer-events: none;

    text-align: center;
}

/* =====================================================
   PLAYER COUNT
===================================================== */

#playerCount {
    position: fixed;

    right: 13px;
    top: 13px;

    z-index: 20;

    color: white;

    font-size: 12px;

    font-weight: bold;

    text-align: right;

    text-shadow:
        0 2px 3px black;

    pointer-events: none;
}

.teamCount {
    display: block;

    line-height: 17px;
}

.blueDot,
.redDot {
    display: inline-block;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    margin-right: 5px;

    vertical-align: -1px;

    border: 1px solid
        rgba(255,255,255,.8);
}

.blueDot {
    background: #3d78ff;
}

.redDot {
    background: #ef4148;
}

/* =====================================================
   CHAT
===================================================== */

#chat {
    position: fixed;

    left: 14px;
    top: 190px;

    z-index: 25;

    width: min(350px, 48vw);

    pointer-events: auto;
}

#chatMessages {
    max-height: 120px;

    overflow: hidden;

    margin-bottom: 6px;
}

.chatMessage {
    color:
        rgba(255,255,255,.72);

    font-size: 12px;

    text-shadow:
        0 2px 3px rgba(0,0,0,.7);

    margin-bottom: 4px;
}

#chatForm {
    display: flex;

    gap: 7px;
}

#chatInput {
    flex: 1;

    min-width: 0;

    height: 36px;

    border: 0;

    outline: none;

    border-radius: 9px;

    padding:
        0 10px;

    background:
        rgba(0,0,0,.35);

    color: white;

    font-size: 13px;
}

#chatSend {
    width: 48px;

    border: 0;

    border-radius: 9px;

    background:
        rgba(255,255,255,.18);

    color: white;

    font-size: 18px;
}

/* =====================================================
   JOYSTICK
===================================================== */

#joystick {
    position: fixed;

    left: 25px;
    bottom: 35px;

    width: 135px;
    height: 135px;

    border:
        3px solid
        rgba(255,255,255,.65);

    border-radius: 50%;

    z-index: 50;

    background:
        rgba(255,255,255,.04);
}

#stick {
    position: absolute;

    width: 58px;
    height: 58px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,.35);

    border:
        2px solid
        rgba(255,255,255,.8);
}

/* =====================================================
   KICK BUTTON
===================================================== */

#kick {
    position: fixed;

    right: 25px;
    bottom: 35px;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        3px solid white;

    background: #ef4148;

    color: white;

    font-size: 18px;

    font-weight: bold;

    z-index: 50;

    box-shadow:
        0 4px 12px rgba(0,0,0,.35);
}

#kick:active {
    transform: scale(.93);

    background: #d62e35;
}

/* =====================================================
   HELP
===================================================== */

#help {
    position: fixed;

    left: 50%;
    bottom: 8px;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.65);

    font-size: 11px;

    z-index: 40;

    pointer-events: none;

    white-space: nowrap;
}

/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 900px) {

    #joystick {
        left: 40px;
        bottom: 40px;
    }

    #kick {
        right: 40px;
        bottom: 40px;
    }

    #chat {
        top: 160px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     GAME
===================================================== -->

<canvas id="game"></canvas>


<!-- =====================================================
     LOBBY
===================================================== -->

<div id="lobby">

    <div id="lobbyBox">

        <div id="lobbyTitle">
            ⚽ BALL HAX ONLINE
        </div>

        <div id="lobbySubtitle">
            Nhập tên người chơi để vào trận
        </div>

        <input
            id="nameInput"
            type="text"
            maxlength="16"
            autocomplete="off"
            placeholder="Tên người chơi"
        >

        <button id="joinButton">
            VÀO TRẬN
        </button>

        <div id="connectionStatus">
            Đang kết nối máy chủ...
        </div>

    </div>

</div>


<!-- =====================================================
     SCOREBOARD
===================================================== -->

<div id="scoreboard">

    <div id="title">
        ⚽ BALL HAX ONLINE
    </div>

    <div id="score">
        0 - 0
    </div>

    <div id="time">
        05:00
    </div>

    <div id="round">
        Vòng 1
    </div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div id="status"></div>


<!-- =====================================================
     PLAYER COUNT
===================================================== -->

<div id="playerCount">

    <span class="teamCount">
        <span class="blueDot"></span>
        <span id="blueCount">0</span>
    </span>

    <span class="teamCount">
        <span class="redDot"></span>
        <span id="redCount">0</span>
    </span>

</div>


<!-- =====================================================
     CHAT
===================================================== -->

<div id="chat">

    <div id="chatMessages"></div>

    <form id="chatForm">

        <input
            id="chatInput"
            type="text"
            maxlength="80"
            autocomplete="off"
            placeholder="Chat..."
        >

        <button id="chatSend"
                type="submit">
            ➤
        </button>

    </form>

</div>


<!-- =====================================================
     JOYSTICK
===================================================== -->

<div id="joystick">

    <div id="stick"></div>

</div>


<!-- =====================================================
     KICK
===================================================== -->

<button id="kick">
    ĐÁ
</button>


<div id="help">
    Kéo vòng tròn để di chuyển • Nhấn ĐÁ để sút
</div>


<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

let DPR = 1;


function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   WORLD
========================================================= */

let WORLD_WIDTH = 1400;
let WORLD_HEIGHT = 700;

const PLAYER_RADIUS = 18;
const BALL_RADIUS = 13;
const GOAL_HEIGHT = 240;


/* =========================================================
   GAME STATE
========================================================= */

let myId = null;

let gameState = {

    W: WORLD_WIDTH,

    H: WORLD_HEIGHT,

    score: {
        blue: 0,
        red: 0
    },

    round: 1,

    mode: "normal",

    timeLeft: 300,

    ball: {
        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2
    },

    players: []

};


/* =========================================================
   CONNECTION
========================================================= */

let socket = null;

let connected = false;

let joined = false;


const lobby =
    document.getElementById("lobby");

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );


function connectSocket() {

    connectionStatus.textContent =
        "Đang kết nối máy chủ...";

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    const address =
        protocol +
        "//" +
        location.host;


    try {

        socket =
            new WebSocket(address);


        socket.addEventListener(
            "open",
            () => {

                connected = true;

                connectionStatus.textContent =
                    "Đã kết nối máy chủ";

                joinButton.disabled =
                    false;

                joinButton.style.opacity =
                    "1";

            }
        );


        socket.addEventListener(
            "message",
            event => {

                receiveMessage(
                    event.data
                );

            }
        );


        socket.addEventListener(
            "close",
            () => {

                connected = false;

                if (joined) {

                    connectionStatus.textContent =
                        "Mất kết nối máy chủ";

                } else {

                    connectionStatus.textContent =
                        "Mất kết nối. Đang thử lại...";

                }

                joinButton.disabled =
                    true;

                setTimeout(
                    connectSocket,
                    1500
                );

            }
        );


        socket.addEventListener(
            "error",
            () => {

                connectionStatus.textContent =
                    "Không kết nối được máy chủ";

            }
        );

    } catch (error) {

        connectionStatus.textContent =
            "Không thể kết nối";

    }

}


/* =========================================================
   RECEIVE SERVER DATA
========================================================= */

function receiveMessage(raw) {

    try {

        const data =
            JSON.parse(raw);


        /* =========================
           WELCOME
        ========================= */

        if (
            data.type ===
            "welcome"
        ) {

            myId =
                String(data.id);

            return;

        }


        /* =========================
           GAME STATE
        ========================= */

        if (
            data.type ===
            "state"
        ) {

            if (
                Number.isFinite(
                    Number(data.W)
                )
            ) {

                WORLD_WIDTH =
                    Number(data.W);

            }


            if (
                Number.isFinite(
                    Number(data.H)
                )
            ) {

                WORLD_HEIGHT =
                    Number(data.H);

            }


            gameState = data;

            updateUI();

            return;

        }


        /* =========================
           CHAT
        ========================= */

        if (
            data.type ===
            "chat"
        ) {

            addChatMessage(
                data.name,
                data.text
            );

            return;

        }


        /* =========================
           ERROR
        ========================= */

        if (
            data.type ===
            "error"
        ) {

            connectionStatus.textContent =
                data.message ||
                "Máy chủ từ chối kết nối";

            return;

        }

    } catch (error) {

        console.log(
            "Dữ liệu server lỗi:",
            error
        );

    }

}


/* =========================================================
   JOIN
========================================================= */

function joinGame() {

    if (
        !connected ||
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        connectionStatus.textContent =
            "Chưa kết nối được máy chủ";

        return;

    }


    let name =
        nameInput.value
            .trim();


    if (!name) {

        name =
            "Player";

    }


    name =
        name
            .slice(0, 16)
            .replace(
                /[<>]/g,
                ""
            );


    socket.send(
        JSON.stringify({

            type: "name",

            name

        })
    );


    joined = true;

    lobby.style.display =
        "none";

}


/* =========================================================
   NAME INPUT
========================================================= */

joinButton.disabled = true;

joinButton.style.opacity =
    ".55";


joinButton.addEventListener(
    "click",
    joinGame
);


nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinGame();

        }

    }
);


/* =========================================================
   INPUT
========================================================= */

const input = {

    up: false,

    down: false,

    left: false,

    right: false

};


let kickPressed = false;


/* =========================================================
   SEND INPUT
========================================================= */

function sendInput(
    kick = false
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN ||
        !joined
    ) {

        return;

    }


    socket.send(
        JSON.stringify({

            type: "input",

            up: input.up,

            down: input.down,

            left: input.left,

            right: input.right,

            kick: kick

        })
    );

}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickPointer = null;


function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const max =
        rect.width / 2 -
        30;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (
        distance >
        max
    ) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;

    }


    const nx =
        dx / max;

    const ny =
        dy / max;


    input.left =
        nx < -.15;

    input.right =
        nx > .15;

    input.up =
        ny < -.15;

    input.down =
        ny > .15;


    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

}


function resetJoystick() {

    input.up = false;
    input.down = false;
    input.left = false;
    input.right = false;


    stick.style.left =
        "50%";

    stick.style.top =
        "50%";


    sendInput(false);

}


joystick.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        joystickPointer =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            joystickPointer
        ) {

            return;

        }

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointerup",
    event => {

        if (
            event.pointerId !==
            joystickPointer
        ) {

            return;

        }

        joystickPointer =
            null;

        resetJoystick();

    }
);


joystick.addEventListener(
    "pointercancel",
    () => {

        joystickPointer =
            null;

        resetJoystick();

    }
);


/* =========================================================
   KICK BUTTON
========================================================= */

const kickButton =
    document.getElementById(
        "kick"
    );


function kick() {

    sendInput(true);

}


kickButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        kick();

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            event.key.startsWith(
                "Arrow"
            ) ||
            event.key === " "
        ) {

            event.preventDefault();

        }


        updateKeyboardInput();

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;


        updateKeyboardInput();

    }
);


function updateKeyboardInput() {

    input.left =
        !!(
            keys["arrowleft"] ||
            keys["a"]
        );

    input.right =
        !!(
            keys["arrowright"] ||
            keys["d"]
        );

    input.up =
        !!(
            keys["arrowup"] ||
            keys["w"]
        );

    input.down =
        !!(
            keys["arrowdown"] ||
            keys["s"]
        );

}


/* =========================================================
   INPUT SEND LOOP
========================================================= */

setInterval(
    () => {

        sendInput(false);

    },
    33
);


/* =========================================================
   CHAT
========================================================= */

const chatForm =
    document.getElementById(
        "chatForm"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );


chatForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const text =
            chatInput.value
                .trim();


        if (
            !text ||
            !socket ||
            socket.readyState !==
            WebSocket.OPEN
        ) {

            return;

        }


        socket.send(
            JSON.stringify({

                type: "chat",

                text

            })
        );


        chatInput.value =
            "";

    }
);


function addChatMessage(
    name,
    text
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "chatMessage";


    element.textContent =
        `${name}: ${text}`;


    chatMessages.appendChild(
        element
    );


    while (
        chatMessages.children.length >
        5
    ) {

        chatMessages.removeChild(
            chatMessages.firstChild
        );

    }

}


/* =========================================================
   UI
========================================================= */

function updateUI() {

    const score =
        gameState.score || {
            blue: 0,
            red: 0
        };


    document.getElementById(
        "score"
    ).textContent =
        `${score.blue} - ${score.red}`;


    let time =
        Number(
            gameState.timeLeft
        ) || 0;


    time =
        Math.max(
            0,
            time
        );


    const minutes =
        Math.floor(
            time / 60
        );

    const seconds =
        Math.floor(
            time % 60
        );


    document.getElementById(
        "time"
    ).textContent =
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(seconds)
            .padStart(2, "0");


    document.getElementById(
        "round"
    ).textContent =
        gameState.mode ===
        "golden"
            ? "CƠ HỘI VÀNG"
            : `Vòng ${gameState.round || 1}`;


    const players =
        Array.isArray(
            gameState.players
        )
            ? gameState.players
            : [];


    let blue = 0;
    let red = 0;


    for (
        const player of players
    ) {

        if (
            player.team ===
            "blue"
        ) {

            blue++;

        } else if (
            player.team ===
            "red"
        ) {

            red++;

        }

    }


    document.getElementById(
        "blueCount"
    ).textContent =
        blue;


    document.getElementById(
        "redCount"
    ).textContent =
        red;


    drawStatus();

}


/* =========================================================
   STATUS
========================================================= */

function drawStatus() {

    const status =
        document.getElementById(
            "status"
        );


    if (
        gameState.mode ===
        "golden"
    ) {

        status.textContent =
            "⚡ CƠ HỘI VÀNG ⚡";

        status.style.display =
            "block";

    } else {

        status.style.display =
            "none";

    }

}


/* =========================================================
   CAMERA / SCALE
========================================================= */

function getScale() {

    const marginX = 20;

    const topSpace = 80;

    const bottomSpace = 20;


    return Math.min(

        (W - marginX * 2) /
        WORLD_WIDTH,

        (H - topSpace -
            bottomSpace) /
        WORLD_HEIGHT

    );

}


function worldToScreen(
    x,
    y
) {

    const scale =
        getScale();


    return {

        x:
            W / 2 +
            (
                x -
                WORLD_WIDTH / 2
            ) *
            scale,

        y:
            H / 2 +
            (
                y -
                WORLD_HEIGHT / 2
            ) *
            scale

    };

}


/* =========================================================
   FIELD
========================================================= */

function drawField() {

    const scale =
        getScale();


    const left =
        W / 2 -
        WORLD_WIDTH / 2 *
        scale;


    const top =
        H / 2 -
        WORLD_HEIGHT / 2 *
        scale;


    const width =
        WORLD_WIDTH *
        scale;


    const height =
        WORLD_HEIGHT *
        scale;


    /*
     * Grass
     */

    ctx.fillStyle =
        "#159447";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Field
     */

    ctx.fillStyle =
        "#159447";


    ctx.fillRect(
        left,
        top,
        width,
        height
    );


    /*
     * Stripes
     */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        ctx.fillStyle =
            i % 2 === 0
                ? "rgba(255,255,255,.025)"
                : "rgba(0,0,0,.025)";


        ctx.fillRect(

            left +
            i *
            width /
            10,

            top,

            width /
            10,

            height

        );

    }


    /*
     * Border
     */

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth = 3;


    ctx.strokeRect(
        left,
        top,
        width,
        height
    );


    /*
     * Half line
     */

    ctx.beginPath();

    ctx.moveTo(
        W / 2,
        top
    );

    ctx.lineTo(
        W / 2,
        top + height
    );

    ctx.stroke();


    /*
     * Center circle
     */

    ctx.beginPath();

    ctx.arc(
        W / 2,
        H / 2,
        90 * scale,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
     * Center point
     */

    ctx.beginPath();

    ctx.arc(
        W / 2,
        H / 2,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    drawPenaltyAreas(
        scale,
        left,
        top
    );

    drawGoals(
        scale,
        left,
        top,
        width,
        height
    );

}


/* =========================================================
   PENALTY AREAS
========================================================= */

function drawPenaltyAreas(
    scale,
    left,
    top
) {

    const boxW = 170;
    const boxH = 300;


    ctx.strokeStyle =
        "rgba(255,255,255,.8)";

    ctx.lineWidth = 2;


    /*
     * LEFT
     */

    ctx.strokeRect(

        left,

        H / 2 -
        boxH / 2 *
        scale,

        boxW *
        scale,

        boxH *
        scale

    );


    /*
     * RIGHT
     */

    ctx.strokeRect(

        left +
        WORLD_WIDTH *
        scale -
        boxW *
        scale,

        H / 2 -
        boxH / 2 *
        scale,

        boxW *
        scale,

        boxH *
        scale

    );

}


/* =========================================================
   GOALS
========================================================= */

function drawGoals(
    scale,
    left,
    top,
    width,
    height
) {

    const goalHeight =
        GOAL_HEIGHT *
        scale;

    const goalDepth =
        70 *
        scale;


    const goalTop =
        H / 2 -
        goalHeight / 2;


    ctx.lineWidth = 3;

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";


    /*
     * LEFT GOAL
     */

    ctx.fillStyle =
        "rgba(255,255,255,.12)";


    ctx.fillRect(

        left -
        goalDepth,

        goalTop,

        goalDepth,

        goalHeight

    );


    ctx.strokeRect(

        left -
        goalDepth,

        goalTop,

        goalDepth,

        goalHeight

    );


    /*
     * RIGHT GOAL
     */

    ctx.fillStyle =
        "rgba(255,255,255,.12)";


    ctx.fillRect(

        left +
        width,

        goalTop,

        goalDepth,

        goalHeight

    );


    ctx.strokeRect(

        left +
        width,

        goalTop,

        goalDepth,

        goalHeight

    );

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(
    player
) {

    const position =
        worldToScreen(
            Number(player.x),
            Number(player.y)
        );


    const scale =
        getScale();


    const radius =
        PLAYER_RADIUS *
        scale;


    const color =
        player.team ===
        "red"
            ? "#ef4148"
            : "#3d78ff";


    /*
     * Shadow
     */

    ctx.beginPath();

    ctx.arc(

        position.x + 2,

        position.y + 3,

        radius,

        0,

        Math.PI * 2

    );

    ctx.fillStyle =
        "rgba(0,0,0,.28)";

    ctx.fill();


    /*
     * Outer disc
     */

    ctx.beginPath();

    ctx.arc(

        position.x,

        position.y,

        radius,

        0,

        Math.PI * 2

    );

    ctx.fillStyle =
        color;

    ctx.fill();


    /*
     * White outline
     */

    ctx.strokeStyle =
        "rgba(255,255,255,.95)";

    ctx.lineWidth = 2;


    ctx.stroke();


    /*
     * Inner HaxBall-like highlight
     */

    ctx.beginPath();

    ctx.arc(

        position.x -
        radius * .27,

        position.y -
        radius * .27,

        radius * .32,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(255,255,255,.22)";

    ctx.fill();


    /*
     * YOU ring
     */

    if (
        String(player.id) ===
        String(myId)
    ) {

        ctx.beginPath();

        ctx.arc(

            position.x,

            position.y,

            radius + 4,

            0,

            Math.PI * 2

        );

        ctx.strokeStyle =
            "rgba(255,255,255,.65)";

        ctx.lineWidth = 2;

        ctx.stroke();

    }


    /*
     * Player name
     */

    ctx.font =
        "bold 10px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "alphabetic";


    ctx.fillStyle =
        "rgba(255,255,255,.9)";


    ctx.shadowColor =
        "rgba(0,0,0,.8)";

    ctx.shadowBlur = 3;


    ctx.fillText(

        String(
            player.name ||
            "Player"
        ).slice(0, 16),

        position.x,

        position.y -
        radius -
        7

    );


    ctx.shadowBlur = 0;

}


/* =========================================================
   BALL
========================================================= */

function drawBall() {

    if (
        !gameState.ball
    ) {

        return;

    }


    const position =
        worldToScreen(

            Number(
                gameState.ball.x
            ),

            Number(
                gameState.ball.y
            )

        );


    const scale =
        getScale();


    const radius =
        BALL_RADIUS *
        scale;


    /*
     * Shadow
     */

    ctx.beginPath();

    ctx.arc(

        position.x + 2,

        position.y + 3,

        radius,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(0,0,0,.25)";


    ctx.fill();


    /*
     * Ball
     */

    ctx.beginPath();

    ctx.arc(

        position.x,

        position.y,

        radius,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#ffffff";


    ctx.fill();


    ctx.strokeStyle =
        "#222";


    ctx.lineWidth = 1.5;


    ctx.stroke();


    /*
     * Black center detail
     */

    ctx.beginPath();

    ctx.arc(

        position.x,

        position.y,

        radius * .24,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "#222";


    ctx.fill();


}


/* =========================================================
   RENDER
========================================================= */

function render() {

    drawField();


    const players =
        Array.isArray(
            gameState.players
        )
            ? gameState.players
            : [];


    /*
     * Vẽ cầu thủ trước
     */

    for (
        const player of players
    ) {

        drawPlayer(
            player
        );

    }


    /*
     * Vẽ bóng sau
     */

    drawBall();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    render();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

connectSocket();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
